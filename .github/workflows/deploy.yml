name: Deploy do Site de Receitas

# O pipeline vai rodar sempre que você atualizar a branch 'principal'
on:
  push:
    branches: [ "principal" ]

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Copia os arquivos do seu repositório para o servidor do GitHub
      - name: Clonar o repositório
        uses: actions/checkout@v4

      # 2. Configura o ambiente do GitHub Pages
      - name: Configurar as Páginas do GitHub
        uses: actions/configure-pages@v4

      # 3. Cria o pacote com o seu HTML, CSS e JS
      - name: Compactar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Indica que os arquivos estão na raiz do projeto (index.html)

      # 4. Envia o site para a internet de forma pública
      - name: Publicar o site
        uses: actions/deploy-pages@v4
