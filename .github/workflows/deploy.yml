name: Deploy do Site de Receitas

on:
  push:
    branches: [ "main" ] # Nome exato da branch padrão aceita pelo GitHub

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar as Páginas do GitHub
        uses: actions/configure-pages@v4

      - name: Compactar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar o site
        uses: actions/deploy-pages@v4
