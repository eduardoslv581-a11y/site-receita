<!doctype html>
<html class="h-full" lang="pt-BR">
    <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Receitas Interativas</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;family=Source+Sans+3:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet"
    />

    <link href="style.css" rel="stylesheet" />
    </head>
    <body class="h-full overflow-auto" style="background: #faf7f2">
    <!-- Header -->
    <header
            class="sticky top-0 z-40"
        style="
        background: rgba(250, 247, 242, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #e8e2d9;
        "
    >
    <div
        class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
        <div
            class="w-10 h-10 rounded-full flex items-center justify-center"
            style="background: #c45d3e">
            <i
                data-lucide="chef-hat"
                style="width: 20px; height: 20px; color: #fff"
            ></i>
        </div>
        <h1
            class="font-display text-2xl font-bold"
            id="site-title"
            style="color: #1a0f08"
        >
            Receitas da Casa
        </h1>
        </div>
        <nav class="hidden md:flex gap-6">
          <button
            class="text-sm font-medium hover:opacity-70 transition"
            onclick="scrollToSection('recipes')"
            style="color: #5a4a3a"
          >
            Receitas
          </button>
          <button
            class="text-sm font-medium hover:opacity-70 transition"
            onclick="scrollToSection('favorites')"
            style="color: #5a4a3a"
          >
            Favoritos
          </button>
        </nav>
      </div>
    </header>
    <!-- Hero - Gestalt: Figura-Fundo com destaque claro -->
    <section
      class="relative overflow-hidden py-16 px-6"
      style="
        background: linear-gradient(
          135deg,
          #c45d3e 0%,
          #d4785e 50%,
          #e8a87c 100%
        );
      "
    >
      <div
        class="absolute inset-0 opacity-10"
        style="
          background-image:
            radial-gradient(circle at 20% 50%, #fff 1px, transparent 1px),
            radial-gradient(circle at 80% 20%, #fff 1px, transparent 1px);
          background-size: 60px 60px;
        "
      ></div>
      <div class="max-w-4xl mx-auto text-center relative z-10 animate-fade-up">
        <h2
          class="font-display text-4xl md:text-5xl font-bold text-white mb-4"
          id="hero-title"
        >
          Cozinhe com Paixão
        </h2>
        <p class="text-lg text-white/85 max-w-lg mx-auto" id="hero-subtitle">
          Receitas interativas que guiam você passo a passo até o prato perfeito
        </p>
        <div class="mt-8 flex justify-center gap-3 flex-wrap">
          <button
            class="category-pill px-5 py-2 rounded-full text-sm font-medium transition bg-white text-gray-800 shadow-md"
            data-cat="all"
            onclick="filterByCategory('all')"
          >
            Todas
          </button>
          <button
            class="category-pill px-5 py-2 rounded-full text-sm font-medium transition bg-white/20 text-white border border-white/40 hover:bg-white hover:text-gray-800"
            data-cat="doce"
            onclick="filterByCategory('doce')"
          >
            🍰 Doces
          </button>
          <button
            class="category-pill px-5 py-2 rounded-full text-sm font-medium transition bg-white/20 text-white border border-white/40 hover:bg-white hover:text-gray-800"
            data-cat="salgado"
            onclick="filterByCategory('salgado')"
          >
            🍝 Salgados
          </button>
          <button
            class="category-pill px-5 py-2 rounded-full text-sm font-medium transition bg-white/20 text-white border border-white/40 hover:bg-white hover:text-gray-800"
            data-cat="bebida"
            onclick="filterByCategory('bebida')"
          >
            🍹 Bebidas
          </button>
        </div>
      </div>
    </section>
    <!-- Receitas Grid - Gestalt: Proximidade (agrupamento) e Similaridade (cards uniformes) -->
    <section class="max-w-6xl mx-auto px-6 py-12" id="recipes">
      <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
        id="recipes-grid"
      ></div>
    </section>
    <!-- Favoritos -->
    <section class="max-w-6xl mx-auto px-6 pb-16" id="favorites">
      <h3 class="font-display text-2xl font-bold mb-6" style="color: #2d2418">
        <i
          data-lucide="heart"
          style="width: 22px; height: 22px; display: inline; color: #c45d3e"
        ></i>
        Seus Favoritos
      </h3>
      <div class="flex flex-wrap gap-3" id="favorites-list">
        <p class="text-sm italic" style="color: #8a7a6a">
          Clique no ❤️ nas receitas para salvar aqui
        </p>
      </div>
    </section>
    <!-- Modal de Receita - Gestalt: Fechamento (container visual) e Figura-Fundo -->
    <div
      class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop overflow-auto"
      id="recipe-modal"
    >
      <div
        class="bg-white rounded-2xl max-w-2xl w-full max-h-[90%] overflow-auto shadow-2xl relative"
        style="animation: fadeUp 0.3s ease"
      >
        <button
          class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition z-10"
          onclick="closeModal()"
        >
          <i data-lucide="x" style="width: 20px; height: 20px; color: #555"></i>
        </button>
        <div id="modal-content"></div>
      </div>
    </div>
    <!-- Toast -->
    <div
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full shadow-lg text-sm font-medium text-white transition-all duration-300 opacity-0 translate-y-4 pointer-events-none"
      id="toast"
      style="background: #2d2418"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
